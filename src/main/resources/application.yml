spring:
  application:
    name: mobilefirst-api

server:
  port: 8080

orderfirst:
  # stub : API du SI bouchonnées (données de démonstration identiques au front).
  integrations: stub
  cors:
    allowed-origins:
      - http://localhost:4200

management:
  endpoints:
    web:
      exposure:
        include: health,info
      # Le front vérifie au démarrage que l'API répond (GET /actuator/health). Mêmes origines que orderfirst.cors.
      cors:
        allowed-origins: http://localhost:4200
        allowed-methods: GET

springdoc:
  swagger-ui:
    path: /swagger-ui.html
